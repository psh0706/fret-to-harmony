<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="베이스·기타 지판부터 텐션까지, 단계별로 깨는 화성악 퀴즈 게임">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>지판에서 화성까지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: a single column "practice book" — fretboard as the hero, worlds as chapters, play screen as one focused card */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --sunk:#F5F6F8; --ink:#15171C; --muted:#5B6371; --line:#D6DAE1;
  --accent:#2B47C9; --accent-soft:#E3E8FB; --accent-ink:#FFFFFF;
  --ok:#1C8449; --ok-soft:#DDF1E5; --bad:#C0392B; --bad-soft:#F8E1DE; --gold:#B7801A;
  --wood:#3A241A; --wood-2:#45291D; --fret:#C3C9D2; --nut:#E8E0CE; --string:#D8C7A0; --pearl:#E9E3D7; --open:#F1EDE4;
  --f-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101318; --surface:#181C23; --sunk:#14171D; --ink:#E7EAF0; --muted:#9AA3B2; --line:#2A303A;
  --accent:#93A5FF; --accent-soft:#232B4A; --accent-ink:#0D1122;
  --ok:#4CC27E; --ok-soft:#173226; --bad:#FF7A6B; --bad-soft:#3A1F1C; --gold:#E2B04A;
  --wood:#2A1A13; --wood-2:#321F16; --fret:#8C939E; --nut:#BDB3A0; --string:#B9A986; --pearl:#CFC7B8; --open:#1E2229; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#181C23; --sunk:#14171D; --ink:#E7EAF0; --muted:#9AA3B2; --line:#2A303A;
  --accent:#93A5FF; --accent-soft:#232B4A; --accent-ink:#0D1122;
  --ok:#4CC27E; --ok-soft:#173226; --bad:#FF7A6B; --bad-soft:#3A1F1C; --gold:#E2B04A;
  --wood:#2A1A13; --wood-2:#321F16; --fret:#8C939E; --nut:#BDB3A0; --string:#B9A986; --pearl:#CFC7B8; --open:#1E2229; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
#app{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}
button{font:inherit;color:inherit}
button:focus-visible,.cell:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
small{font-size:.78em}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.top h1{font-size:clamp(2rem,6vw,3.1rem);line-height:1.05;margin-top:4px}
.top p{margin:6px 0 0;color:var(--muted);max-width:52ch}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{display:inline-flex;gap:6px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px}
.chip.cloud{color:var(--muted)}
.chip.cloud[data-st="cloud"]{color:var(--ok);border-color:var(--ok)}
.chip b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* fretboard */
.board-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-inline:-4px;padding:4px 4px 2px}
.board{display:grid;min-width:560px;user-select:none}
.slabel{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-mono);line-height:1;padding-right:6px}
.slabel b{font-size:14px}.slabel small{font-size:10px;color:var(--muted);margin-top:2px}
.cell{position:relative;height:40px;border:0;padding:0;margin:0;background:var(--wood);border-right:3px solid var(--fret);cursor:pointer;display:flex;align-items:center;justify-content:center}
.cell.alt{background:var(--wood-2)}
.cell.open{background:var(--open);border-right:7px solid var(--nut)}
.cell::before{content:"";position:absolute;left:0;right:0;top:50%;height:var(--th,2px);transform:translateY(-50%);background:var(--string);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.cell.open::before{box-shadow:none;opacity:.9}
.cell.rowhi{box-shadow:inset 0 0 0 999px rgba(147,165,255,.16)}
.cell:hover:not(:has(.mk))::after{content:"";width:22px;height:22px;border-radius:50%;background:var(--pearl);opacity:.35;position:relative}
.board.locked .cell{cursor:default}
.board.locked .cell:hover::after{display:none}
.mk{position:relative;z-index:1;min-width:30px;height:30px;padding:0 4px;border-radius:15px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-weight:600;font-size:12px;line-height:1;background:var(--pearl);color:#2a1d15;text-align:center}
.mk.two{flex-direction:column;font-size:9.5px;gap:1px}
.mk.q{background:var(--accent);color:var(--accent-ink);animation:pulse 1.4s ease-in-out infinite}
.mk.root{background:var(--accent);color:var(--accent-ink)}
.mk.ok{background:var(--ok);color:#fff}
.mk.bad{background:var(--bad);color:#fff}
.mk.ans{background:transparent;color:#fff;border:2px dashed #fff}
.mk.ghost{background:transparent;color:var(--pearl);border:1.5px solid var(--pearl);opacity:.8}
.mk.name{background:rgba(233,227,215,.92)}
.mk.name.sharp{background:rgba(233,227,215,.55)}
.mk.flash{background:var(--accent);color:var(--accent-ink)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(147,165,255,.25)}}
@media (prefers-reduced-motion:reduce){.mk.q{animation:none}}
.fnum{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;padding-top:4px;position:relative;font-variant-numeric:tabular-nums}
.fnum.dot::after,.fnum.dot2::after{content:"";display:block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin:3px auto 0;opacity:.6}
.fnum.dot2::after{width:18px;height:7px;background:radial-gradient(circle at 3.5px 3.5px,var(--muted) 3.5px,transparent 4px),radial-gradient(circle at 14.5px 3.5px,var(--muted) 3.5px,transparent 4px)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:18px 0 28px}
.hero-head{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;margin-bottom:10px}
.hero-head h2{font-size:20px}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.tg{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer}
.tg[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:500}

/* roadmap */
.world{margin:30px 0 0}
.world-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.wnum{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--muted)}
.world-head h2{font-size:24px}
.world p.wdesc{margin:0 0 12px;color:var(--muted);font-size:14px;max-width:60ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px 11px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:96px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile .id{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.tile .tt{font-weight:700;font-size:14.5px;line-height:1.35}
.tile .ty{font-size:12px;color:var(--muted)}
.tile .stars{margin-top:auto;font-size:14px;letter-spacing:2px;color:var(--line)}
.tile .stars .on{color:var(--gold)}
.tile.locked{cursor:not-allowed;opacity:.5;background:var(--sunk)}
.tile.locked:hover{transform:none;border-color:var(--line)}
.tile.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tag{font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.tag.inst{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.settings{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font-size:13px}
.settings .lbl{color:var(--muted);margin-right:4px}

/* lesson + play */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.back{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:14px}
.bar .st{font-weight:700}
.bar .st span{font-family:var(--f-mono);color:var(--muted);font-weight:500;margin-right:6px}
.dots{display:flex;gap:4px;margin-left:auto}
.dots i{width:10px;height:10px;border-radius:3px;background:var(--line)}
.dots i.ok{background:var(--ok)}.dots i.bad{background:var(--bad)}.dots i.cur{background:var(--accent)}
.combo{font-family:var(--f-mono);font-size:13px;color:var(--gold);min-width:64px;text-align:right}
.prompt{font-size:clamp(18px,3.4vw,22px);line-height:1.45;margin:2px 0 14px;text-wrap:balance}
.prompt b{color:var(--accent)}
.kind{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:8px;margin-top:14px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--sunk);border-radius:10px;padding:11px 12px;cursor:pointer;font-size:15.5px;min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted);background:var(--surface);flex:none}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.ear{display:flex;gap:8px;align-items:center;margin:4px 0 6px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:15px}
.btn.ghost{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:var(--sunk)}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb h3{font-family:var(--f-body);font-weight:700;font-size:16px;margin-bottom:4px}
.fb p{margin:6px 0}
.fb ul{margin:6px 0;padding-left:20px}
details.fx{border-top:1px solid var(--line);padding-top:6px;margin-top:8px}
details.fx>summary{cursor:pointer;font-weight:700;font-size:14px;padding:4px 0;list-style:none;display:flex;align-items:center;gap:6px}
details.fx>summary::-webkit-details-marker{display:none}
details.fx>summary::before{content:"▸";font-size:11px;color:var(--muted);transition:transform .15s}
details.fx[open]>summary::before{transform:rotate(90deg)}
details.fx .fxb{padding:2px 0 4px}
details.fx .rules{margin:6px 0;padding-left:0}
details.fx .rules li{background:var(--surface)}
.whybox{background:var(--surface);border-left:3px solid var(--bad);border-radius:6px;padding:8px 12px;margin:8px 0 10px}
.whybox .wl{display:block;font-size:12.5px;color:var(--muted);margin-bottom:2px}
.fb .path{font-family:var(--f-mono);font-size:14px;overflow-wrap:anywhere}
.fb .path small,.path small{color:var(--muted);font-size:10px;vertical-align:sub;margin-left:1px}
.fb-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.rules{list-style:none;padding:0;margin:12px 0;display:grid;gap:8px}
.rules li{background:var(--sunk);border-radius:8px;padding:9px 12px;border-left:3px solid var(--accent)}
.rules li.trap{border-left-color:var(--bad)}
.rules li b{font-weight:700}
.lesson h2{font-size:26px;margin:6px 0 2px}
.lesson .sub{color:var(--muted);margin:0 0 6px}
.lesson h3{font-family:var(--f-body);font-size:14px;font-weight:700;margin-top:16px;color:var(--muted)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:13.5px;margin:6px 0}
.tbl td,.tbl th{border:1px solid var(--line);padding:4px 8px;text-align:center;font-variant-numeric:tabular-nums}
.tbl th{background:var(--sunk);font-weight:500}
.result{text-align:center;padding-block:10px}
.result .big{font-family:var(--f-display);font-size:56px;line-height:1}
.result .stars{font-size:36px;letter-spacing:6px;color:var(--line);margin:8px 0}
.result .stars .on{color:var(--gold)}
.misslist{text-align:left;margin:16px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.misslist li{background:var(--sunk);border-radius:8px;padding:8px 12px;font-size:14px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px}
.misslist li b{color:var(--ok)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:500;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
</style>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
// ===== core music model =====
const LET=['C','D','E','F','G','A','B'], NAT=[0,2,4,5,7,9,11];
const SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FL=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const INSTR={
  bass:{name:'베이스',strings:[['E',28],['A',33],['D',38],['G',43]]},
  guitar:{name:'기타',strings:[['E',40],['A',45],['D',50],['G',55],['B',59],['e',64]]}
};
let S={inst:'bass',stars:{},xp:0,misses:{},sound:true,octUp:false,unlockAll:false};
let ST=[];
function setInst(k){S.inst=INSTR[k]?k:'bass';const a=INSTR[S.inst].strings;ST=a.map(([n,m],i)=>({n,m,pc:m%12,no:a.length-i}));}
setInst('bass');
const NS=()=>ST.length;
const isGtr=()=>S.inst==='guitar';
const pcAt=(s,f)=>(ST[s].pc+f)%12, mAt=(s,f)=>ST[s].m+f;
const sName=s=>`${ST[s].n}줄`;
const gap=(a,b)=>ST[b].m-ST[a].m;
const isNat=pc=>NAT.includes(pc);
const pair=pc=>isNat(pc)?SH[pc]:SH[pc]+'/'+FL[pc];
const R=n=>Math.floor(Math.random()*n);
const pick=a=>a[R(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const uniq=a=>[...new Set(a)];
const cells=fn=>{const o=[];for(let s=0;s<NS();s++)for(let f=0;f<=12;f++)if(fn(s,f))o.push({s,f});return o;};
const baseM=()=>isGtr()?48:36;
const sg=n=>(n>=0?'+':'−')+Math.abs(n);

// spelled notes
const N=str=>({l:LET.indexOf(str[0]),a:(str.match(/#/g)||[]).length-(str.match(/♭/g)||[]).length});
const ns=n=>LET[n.l]+(n.a>0?'#'.repeat(n.a):'♭'.repeat(-n.a));
const npc=n=>((NAT[n.l]+n.a)%12+12)%12;
function up(r,num,semi){const l=(r.l+num-1)%7;const pc=((npc(r)+semi)%12+12)%12;let a=((pc-NAT[l])%12+12)%12;if(a>6)a-=12;return{l,a};}
const dbl=arr=>arr.some(n=>Math.abs(n.a)>1);
function enh(n){for(const d of [1,6]){const l=(n.l+d)%7;let a=((npc(n)-NAT[l])%12+12)%12;if(a>6)a-=12;if(Math.abs(a)<=1&&!(l===n.l))return{l,a};}return null;}
const PREF_MAJ={1:'D♭',3:'E♭',6:'F#',8:'A♭',10:'B♭'}, PREF_MIN={1:'C#',3:'E♭',6:'F#',8:'G#',10:'B♭'};
const spellRoot=(pc,minorish)=>isNat(pc)?N(SH[pc]):N((minorish?PREF_MIN:PREF_MAJ)[pc]);

const Q={
  maj:{sym:'',ko:'메이저',iv:[[3,4],[5,7]]},
  min:{sym:'m',ko:'마이너',iv:[[3,3],[5,7]]},
  dim:{sym:'dim',ko:'디미니시',iv:[[3,3],[5,6]]},
  aug:{sym:'aug',ko:'오그먼트',iv:[[3,4],[5,8]]},
  maj7:{sym:'maj7',ko:'메이저7',iv:[[3,4],[5,7],[7,11]]},
  dom7:{sym:'7',ko:'도미넌트7',iv:[[3,4],[5,7],[7,10]]},
  m7:{sym:'m7',ko:'마이너7',iv:[[3,3],[5,7],[7,10]]},
  m7b5:{sym:'m7♭5',ko:'하프 디미니시',iv:[[3,3],[5,6],[7,10]]},
  dim7:{sym:'dim7',ko:'디미니시7',iv:[[3,3],[5,6],[7,9]]}
};
const IVN={'3-3':'단3도','3-4':'장3도','5-6':'감5도','5-7':'완전5도','5-8':'증5도','7-9':'감7도','7-10':'단7도','7-11':'장7도'};
const chord=(r,q)=>[r,...Q[q].iv.map(([n,s])=>up(r,n,s))];
const cStr=arr=>arr.map(ns).join(' – ');
const sym=(r,q)=>ns(r)+Q[q].sym;
const chordMidis=(r,q)=>{const b=baseM()+npc(r);return [b,...Q[q].iv.map(x=>b+x[1])];};
const minorish=q=>['min','m7','m7b5','dim','dim7'].includes(q);

const MAJ=[0,2,4,5,7,9,11], NMIN=[0,2,3,5,7,8,10];
const scale=(r,semis)=>semis.map((s,i)=>up(r,i+1,s));
const MAJ_KEYS=['C','G','D','A','E','B','F#','F','B♭','E♭','A♭','D♭'];
const MIN_KEYS=['A','E','B','F#','C#','G#','D','G','C','F','B♭','E♭'];
const DIA7=['maj7','m7','m7','maj7','dom7','m7','m7b5'];
const ROM=['I','II','III','IV','V','VI','VII'];
const romSym=i=>ROM[i]+Q[DIA7[i]].sym;
const FUNC=['T','SD','T','SD','D','T','D'];
const FKO={T:'토닉 (T)',SD:'서브도미넌트 (SD)',D:'도미넌트 (D)'};
const diatonic=k=>{const sc=scale(N(k),MAJ);return sc.map((n,i)=>({root:n,q:DIA7[i],sym:sym(n,DIA7[i]),rom:romSym(i),i}));};

const INTS=[
  {s:1,n:2,name:'단2도',tip:'반음 하나. 같은 줄 1프렛.'},
  {s:2,n:2,name:'장2도',tip:'온음. 같은 줄 2프렛.'},

function why5(s){

}
function why7(s){

}
function nameNote(pc){

  if(pc===11||pc===4) return `<p>${SH[pc]}와 ${SH[(pc+1)%12]} 사이에는 반음이 없어요. 이 음은 그냥 <b>${SH[pc]}</b>로 불러요.</p>`;
  if(pc===0||pc===5) return `<p>${SH[(pc+11)%12]}와 ${SH[pc]} 사이에는 반음이 없어요. 이 음은 그냥 <b>${SH[pc]}</b>로 불러요.</p>`;

function g93(){

function makeSet(st,n){

  while(qs.length<n&&tries<400){tries++;const q=st.gen();if(!q) continue;if(keys.has(q.key)&&tries<300) continue;keys.add(q.key);qs.push(q);}

function mcQ(o){

    explain:o.explain||'',why:o.why||null,play:o.play||null,playMode:o.playMode||'mel',ear:!!o.ear,miss:o.miss||null,answer:o.cor,recap:o.recap||o.prompt};
}

// fretboard names
function qName(s,f,mode){
  const pc=pcAt(s,f), cor=pair(pc);let c=[];
  if(mode==='letters'){const li=NAT.indexOf(pc);c=shuffle([LET[(li+1)%7],LET[(li+6)%7],LET[(li+2)%7],LET[(li+5)%7]]);}
  else if(!isNat(pc)){
    const lo=NAT.indexOf((pc+11)%12),hi=NAT.indexOf((pc+1)%12);
    const w1=`${LET[(lo+6)%7]}#/${FL[pc]}`,w2=`${SH[pc]}/${LET[(hi+1)%7]}♭`;const nb=shuffle([pair((pc+2)%12),pair((pc+10)%12)]);
    c=mode==='trap'?[w1,w2,nb[0]]:shuffle([w1,nb[0],nb[1]]);
  } else {
    const alias={11:'C♭',0:'B#',4:'F♭',5:'E#'}[pc];const nb=shuffle([pair((pc+1)%12),pair((pc+11)%12),pair((pc+2)%12),pair((pc+10)%12)]);
    c=(mode==='trap'&&alias)?[alias,nb[0],nb[1]]:nb;
  }
  const why=l=>{
    const p=[...Array(12).keys()].find(x=>pair(x)===l||SH[x]===l);
    if(p!==undefined){const fr=cells((a,b)=>a===s&&pcAt(a,b)===p).map(x=>x.f);const nf=fr.reduce((b,x)=>Math.abs(x-f)<Math.abs(b-f)?x:b,fr[0]);const d=f-nf;
      return `${l}는 ${sName(s)} <b>${nf}프렛</b>에 있어요. 문제의 ${f}프렛보다 ${Math.abs(d)}프렛 ${d>0?'아래':'위'}예요.`;}
    if(['C♭','B#','F♭','E#'].includes(l)) return `${l}는 이론상 같은 높이지만, B-C·E-F 사이에는 반음이 없어서 지판에서는 자연음 이름 <b>${cor}</b>로 불러요.`;
    const [a,b]=l.split('/');return `${a}와 ${b}는 같은 음이 아니에요. #과 ♭ 이름의 글자는 알파벳 바로 옆이어야 해요. 이 자리는 <b>${cor}</b>.`;
  };
  return mcQ({key:`n${s}-${f}`,kind:'위치 → 음 이름',prompt:`<b>${sName(s)} ${f}프렛</b>은 무슨 음일까요?`,marks:[{s,f,label:'?',cls:'q'}],cor,wrong:c,why,explain:explainPos(s,f),play:[mAt(s,f)],miss:{s,f},recap:`${sName(s)} ${f}프렛`});
}

let CLOUD=null,cloudState='local',cloudTimer=null,cloudBusy=false,cloudDirty=false,cloudRetry=0;
const CLOUD_TXT={cloud:'계정에 자동 저장 중',connecting:'저장소 연결 중…',local:'이 브라우저에만 저장'};
function setCloud(st){cloudState=st;const el=document.getElementById('cloudChip');if(el){el.textContent=CLOUD_TXT[st];el.dataset.st=st;}}
const payload=()=>({v:1,stars:S.stars,xp:S.xp,misses:S.misses,inst:S.inst,sound:S.sound,octUp:S.octUp,unlockAll:S.unlockAll,updatedAt:S.updatedAt||0});
function queueCloud(){if(!CLOUD) return;cloudDirty=true;clearTimeout(cloudTimer);cloudTimer=setTimeout(flushCloud,1200);}
async function flushCloud(){
  if(!CLOUD||cloudBusy||!cloudDirty) return;cloudBusy=true;cloudDirty=false;
  try{await CLOUD.set(JSON.parse(JSON.stringify(payload())));cloudRetry=0;}
  catch(e){const c=e&&e.code;
    if(c==='unavailable'&&cloudRetry<1){cloudRetry++;cloudDirty=true;setTimeout(flushCloud,1500+Math.random()*1500);}
    else if(c==='resource_exhausted'){cloudDirty=true;setTimeout(flushCloud,8000);}
    else{CLOUD=null;setCloud('local');}}
  cloudBusy=false;if(cloudDirty&&CLOUD) queueCloud();
}
function mergeCloud(c){
  const st=Object.assign({},c.stars||{});for(const k in S.stars) st[k]=Math.max(st[k]||0,S.stars[k]||0);
  const newer=(c.updatedAt||0)>(S.updatedAt||0);
  S.stars=st;S.xp=Math.max(S.xp||0,c.xp||0);
  if(newer){S.misses=c.misses||{};for(const k of ['inst','sound','octUp','unlockAll']) if(k in c) S[k]=c[k];S.updatedAt=c.updatedAt;}
  setInst(S.inst);
}
async function initCloud(){
  const C=window.claude;if(!C||typeof C.use!=='function'){setCloud('local');return;}
  setCloud('connecting');
  try{
    const [user,db]=await Promise.all([C.use('user'),C.use('db')]);
    const id=user?await user.id():null;
    if(!db||!id){setCloud('local');return;}
    const ref=db.doc(`data/users/${id}/progress`);const snap=await ref.get();
    const before=snap.exists?JSON.stringify(snap.data()):'';
    if(snap.exists) mergeCloud(snap.data());
    writeLocal();CLOUD=ref;setCloud('cloud');
    if(JSON.stringify(payload())!==before){cloudDirty=true;flushCloud();}
    if(!G) renderHome();
  }catch(e){CLOUD=null;setCloud('local');}
}

// ===== audio =====
let AC=null,MASTER=null;
function ac(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C) return null;AC=new C();
    MASTER=AC.createDynamicsCompressor();MASTER.threshold.value=-18;MASTER.ratio.value=4;MASTER.connect(AC.destination);}
  if(AC.state==='suspended') AC.resume();return AC;
}
function tone(m,t0,dur,vol){
  const a=ac();if(!a||!S.sound) return;const f=440*Math.pow(2,(m+(S.octUp?12:0)-69)/12);const t=a.currentTime+t0;
  const o1=a.createOscillator();o1.type='sawtooth';o1.frequency.value=f;
  const o2=a.createOscillator();o2.type='triangle';o2.frequency.value=f;
  const lp=a.createBiquadFilter();lp.type='lowpass';lp.Q.value=2.5;
  const top=isGtr()?3800:2200,bot=isGtr()?1200:520;
  lp.frequency.setValueAtTime(top,t);lp.frequency.exponentialRampToValueAtTime(bot,t+.35);
  const g=a.createGain();const v=vol||.32;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(v*.35,t+.45);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  const g2=a.createGain();g2.gain.value=.7;
  o1.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(g);g.connect(MASTER);
  o1.start(t);o2.start(t);o1.stop(t+dur+.05);o2.stop(t+dur+.05);
}
function play(ms,mode){
  if(!ms||!ms.length) return;
  if(mode==='chord'){ms.forEach((m,i)=>tone(m,i*.28,1.0,.24));ms.forEach(m=>tone(m,ms.length*.28+.15,1.6,.17));}
  else ms.forEach((m,i)=>tone(m,i*(ms.length>3?.32:.55),ms.length>3?.55:.9));
}

  if(q.type==='board'||q.marks) h+=`<div id="qb">${boardHTML({marks:q.marks||[],rowHi:q.rowHi,locked:q.type!=='board'})}</div>`;
  if(q.type==='board') h+=`<p class="hint" id="prog">${q.groups.length>1?`남은 음: <b>${q.groups.length}</b>개`:'지판에서 한 칸을 누르세요'}</p>`;
  if(q.type==='mc') h+=`<div class="opts">${q.options.map((o,k)=>`<button type="button" class="opt" data-k="${k}"><kbd>${k+1}</kbd><span>${o.l}</span></button>`).join('')}</div>`;
  h+=`<div id="fb"></div></div>`;
  app.innerHTML=h;
  $('#quit').onclick=renderHome;
  if(q.ear){$('#replay').onclick=()=>play(q.play,q.playMode);setTimeout(()=>play(q.play,q.playMode),250);}
  if(q.type==='mc') app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answerMC(+b.dataset.k));
  if(q.type==='board') $('#qb').querySelectorAll('.cell').forEach(c=>c.onclick=()=>clickCell(+c.dataset.s,+c.dataset.f));
}
function answerMC(k){
  if(G.answered) return;const q=G.q,o=q.options[k];if(!o) return;G.picked=o.l;
  app.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.options[j].ok) b.classList.add('ok');else if(j===k) b.classList.add('bad');});
  if(q.marks){const m=q.marks.find(x=>x.cls==='q');if(m) setMark($('#qb'),m.s,m.f,q.answer,o.ok?'ok':'bad');}
  finish(o.ok);
}
function clickCell(s,f){
  if(G.answered) return;const q=G.q,qb=$('#qb');
  if((q.marks||[]).some(m=>m.s===s&&m.f===f)) return;
  const gi=q.groups.findIndex((g,i)=>!G.found.has(i)&&g.cells.some(c=>c.s===s&&c.f===f));
  if(gi>=0){G.found.add(gi);setMark(qb,s,f,q.groups[gi].label,'ok');tone(mAt(s,f),0,.8);
    const left=q.groups.length-G.found.size;const pr=$('#prog');if(pr) pr.innerHTML=left?`남은 음: <b>${left}</b>개`:'완료!';
    if(!left) finish(true);return;}
  if(q.groups.some((g,i)=>G.found.has(i)&&g.cells.some(c=>c.s===s&&c.f===f))) return;
  setMark(qb,s,f,SH[pcAt(s,f)],'bad');tone(mAt(s,f),0,.6,.2);
  q.groups.forEach((g,i)=>{if(!G.found.has(i)) g.cells.forEach(c=>setMark(qb,c.s,c.f,g.label,'ans'));});
  finish(false);
}
let FX={sol:true,rule:false};try{const v=JSON.parse(localStorage.getItem('fretboard-harmony.fx'));if(v) FX=Object.assign(FX,v);}catch(e){}
function fxRules(){
  const st=G.st;if(!st||typeof st.rules!=='function') return `<details class="fx" data-fx="rule"${FX.rule?' open':''}><summary>공식 다시 보기</summary><div class="fxb">${explainRuleFallback()}</div></details>`;
  const r=st.rules(),t=st.traps?st.traps():[];
  return `<details class="fx" data-fx="rule"${FX.rule?' open':''}><summary>공식 다시 보기 · ${T(st)}</summary><div class="fxb"><ul class="rules">${r.map(x=>`<li>${x}</li>`).join('')}${t.map(x=>`<li class="trap">${x}</li>`).join('')}</ul></div></details>`;
}
function explainRuleFallback(){return '<ul class="rules"><li>기준 프렛 <b>0·5·7·10·12</b>에서 출발해서 세기</li><li><b>#</b> = 아래 글자 + # · <b>♭</b> = 위 글자 + ♭</li><li><b>B-C, E-F</b> 사이에는 #/♭ 없음</li></ul>';}
function bindFx(){document.querySelectorAll('#fb details.fx').forEach(d=>d.addEventListener('toggle',()=>{FX[d.dataset.fx]=d.open;try{localStorage.setItem('fretboard-harmony.fx',JSON.stringify(FX));}catch(e){}}));}
function finish(ok){
  G.answered=true;const q=G.q;G.res.push(ok);
  if(ok){G.score++;G.combo++;const gain=10+Math.min(G.combo-1,5)*2;S.xp+=gain;
    if(q.miss&&S.misses[S.inst]) delete S.misses[S.inst][q.miss.s+'-'+q.miss.f];}
  else{G.combo=0;G.wrong.push({p:stripTags(q.recap),a:q.answer});
    if(q.miss){S.misses[S.inst]=S.misses[S.inst]||{};S.misses[S.inst][q.miss.s+'-'+q.miss.f]=q.miss;}}
  save();
  if(q.type==='board'&&ok){const qb=$('#qb');q.groups.forEach(g=>g.cells.forEach(c=>{const cell=qb.querySelector(`.cell[data-s="${c.s}"][data-f="${c.f}"]`);if(cell&&!cell.innerHTML) setMark(qb,c.s,c.f,g.label,'ghost');}));}
  if(!q.ear&&q.play) play(q.play,q.playMode);
  const last=G.n===G.qs.length-1;
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><h3>${ok?pick(['정답!','맞아요!','좋아요!']):'아쉬워요. 정답은 '+q.answer}</h3>${!ok&&q.type==='mc'&&G.picked&&whyOf(q,G.picked)?`<div class="whybox"><span class="wl">고른 답: ${G.picked}</span>${whyOf(q,G.picked)}</div>`:''}<details class="fx" data-fx="sol"${FX.sol?' open':''}><summary>이 문제 풀이</summary><div class="fxb">${q.explain}</div></details>${fxRules()}
   <div class="fb-actions">${q.play&&!q.ear?'<button type="button" class="btn ghost" id="hear">▶ 소리</button>':''}<button type="button" class="btn" id="next">${last?'결과 보기':'다음'}</button></div></div>`;
  const hr=$('#hear');if(hr) hr.onclick=()=>play(q.play,q.playMode);bindFx();
  $('#next').onclick=next;$('#next').focus({preventScroll:true});
  $('#fb').scrollIntoView&&$('#fb').scrollIntoView({block:'nearest',behavior:'smooth'});
}
function next(){if(G.n<G.qs.length-1){G.n++;renderQ();window.scrollTo&&window.scrollTo(0,0);}else renderEnd();}
function renderEnd(){
  const sc=G.score,tot=G.qs.length,stars=sc>=tot?3:sc>=Math.ceil(tot*.8)?2:sc>=Math.ceil(tot*.6)?1:0;
  if(!G.review){const k=stageKey(G.st);S.stars[k]=Math.max(S.stars[k]||0,stars);save();}
  const nxt=G.i>=0&&G.i<STAGES.length-1&&isUnlocked(G.i+1)?G.i+1:-1;
  app.innerHTML=`<div class="bar"><button type="button" class="back" id="home">← 홈</button><span class="st"><span>${G.st.id}</span>${T(G.st)}</span></div>
  <div class="card result"><div class="big">${sc}<span class="muted" style="font-size:.45em"> / ${tot}</span></div><div class="stars">${starHTML(stars)}</div>
  <p>${stars===3?'완벽해요. 이 단계는 확실히 익혔어요.':stars>0?(G.review?'복습 완료.':'통과! 다음 단계가 열렸어요.'):'6개 이상 맞히면 통과예요. 규칙을 한 번 더 보고 다시 도전해요.'}</p>
  ${G.wrong.length?`<ul class="misslist">${G.wrong.map(w=>`<li><span>${w.p}</span><b>${w.a}</b></li>`).join('')}</ul>`:''}
  <div class="row"><button type="button" class="btn ghost" id="again">다시 하기</button>${nxt>=0?`<button type="button" class="btn" id="nx">다음 단계 ${STAGES[nxt].id}</button>`:''}</div></div>`;
  $('#home').onclick=renderHome;$('#again').onclick=()=>G.review?startReview():renderLesson(G.i);
  const nb=$('#nx');if(nb) nb.onclick=()=>renderLesson(nxt);
}
document.addEventListener('keydown',e=>{
  if(!G||e.metaKey||e.ctrlKey||e.altKey) return;
  if(G.answered&&(e.key==='Enter'||e.key===' ')&&$('#next')){e.preventDefault();next();return;}
  if(!G.answered&&G.q&&G.q.type==='mc'&&/^[1-9]$/.test(e.key)) answerMC(+e.key-1);
});
renderHome();
initCloud();
</script>
